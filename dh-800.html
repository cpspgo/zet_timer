<style>
  .timer-wrap * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .timer-wrap {
    font-family:
      -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
      sans-serif;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(18px, 4vw, 30px) 0 0 0;
    background: linear-gradient(
      180deg,
      #fbf4ea 0%,
      #fcf7f0 22%,
      #ffffff 58%,
      #ffffff 100%
    );
  }

  .timer-container {
    text-align: center;
    padding: 0 clamp(16px, 5vw, 32px) 0;
    width: 100%;
    max-width: 480px;
  }

  .sale-badge {
    display: block;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 10px;
    background: #ef5a6f;
    color: #fff;
    padding: 7px 16px;
    border-radius: 999px;
    font-size: clamp(12px, 3.4vw, 14px);
    font-weight: 900;
    letter-spacing: -0.2px;
    box-shadow: 0 12px 24px rgba(239, 90, 111, 0.18);
  }

  .title {
    font-size: clamp(18px, 5vw, 23px);
    font-weight: 900;
    color: #111827;
    letter-spacing: -0.6px;
    margin-bottom: 16px;
    word-break: keep-all;
  }

  .countdown {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(6px, 2vw, 10px);
    margin-bottom: 14px;
    flex-wrap: nowrap;
  }
  .time-box {
    background: #ffffff;
    border-radius: 18px;
    padding: clamp(10px, 2.6vw, 14px) clamp(12px, 3.2vw, 18px);
    min-width: clamp(54px, 14vw, 72px);
    box-shadow: 0 16px 30px rgba(15, 23, 42, 0.1);
    border: 1px solid rgba(15, 23, 42, 0.06);
    flex-shrink: 0;
  }
  .time-number {
    font-size: clamp(31px, 8.8vw, 44px);
    font-weight: 900;
    color: #ef5a6f;
    line-height: 1;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .colon {
    font-size: clamp(22px, 6.3vw, 30px);
    color: rgba(239, 90, 111, 0.55);
    font-weight: 400;
    margin-bottom: 2px;
    flex-shrink: 0;
  }
  .time-box.tenth {
    background: #ef5a6f;
    border-radius: 18px;
    padding: clamp(10px, 2.6vw, 14px) clamp(12px, 3.2vw, 16px);
    min-width: clamp(44px, 11vw, 58px);
    box-shadow: 0 16px 30px rgba(239, 90, 111, 0.2);
    border: 1px solid rgba(239, 90, 111, 0.25);
  }
  .time-box.tenth .time-number {
    font-size: clamp(27px, 7.4vw, 38px);
    color: #fff;
    letter-spacing: -0.8px;
  }

  .price-warning {
    font-size: clamp(12px, 3.4vw, 15px);
    color: #ef5a6f;
    font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: -0.3px;
    word-break: keep-all;
  }

  /* 하루 주문 가능수량 배지 */
  .limit-pill {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 2vw, 10px);
    width: fit-content; /* 가로: 글자 크기에 맞춰 좁게 */
    max-width: 100%;
    margin: 0 auto 18px;
    padding: clamp(6px, 1.8vw, 9px) clamp(16px, 4.5vw, 22px); /* 세로 / 가로 여백 */
    border-radius: 999px;
    background: linear-gradient(90deg, #ff2d6f 0%, #e8174f 100%);
    color: #fff;
    font-size: clamp(16px, 4.9vw, 22px);
    font-weight: 900;
    letter-spacing: -0.5px;
    white-space: nowrap;
    box-shadow:
      0 0 24px rgba(255, 45, 111, 0.45),
      0 10px 24px rgba(239, 90, 111, 0.25);
  }
  .limit-pill .limit-num {
    font-style: italic;
    color: #ffe500;
    font-weight: 900;
    display: inline-block;
    animation: twBlink 1s ease-in-out infinite !important;
  }
  @keyframes twBlink {
    0%,
    100% {
      opacity: 1;
      text-shadow: 0 0 10px rgba(255, 229, 0, 0.8);
    }
    50% {
      opacity: 0.25;
      text-shadow: none;
    }
  }
  .limit-pill .spark {
    font-size: 0.9em;
    animation: twSpark 1.6s ease-in-out infinite;
  }
  .limit-pill .spark:last-child {
    animation-delay: 0.8s;
  }
  @keyframes twSpark {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.5;
      transform: scale(1.3);
    }
  }

  .card-soft {
    background: #fafafa;
    border: none !important;
    box-shadow: none !important;
  }

  .card-wide {
    width: calc(100% + 36px);
    margin-left: -18px;
    margin-right: -18px;
    margin-bottom: 14px;
    padding: 0 6px;
  }
  .card-wide > .card-inner {
    border-radius: 26px;
    padding: 16px 18px;
  }

  .stock-warning-title {
    font-size: clamp(14px, 4vw, 17px);
    font-weight: 900;
    color: #111827;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
    word-break: keep-all;
  }
  .stock-warning-title .arrow {
    display: inline-block;
    font-size: 1.3em;
    font-weight: 900;
    line-height: 1;
    vertical-align: -0.05em;
    -webkit-text-stroke: 1.2px currentColor; /* 화살표 선 두께 */
  }
  .stock-warning-sub {
    font-size: 13px;
    color: #9aa0a6;
    font-weight: 700;
    word-break: keep-all;
  }

  .satisfaction-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .satisfaction-title {
    font-size: 15px;
    font-weight: 900;
    color: #111827;
  }
  .satisfaction-badge {
    font-size: 12px;
    font-weight: 800;
    color: #ff6b35;
  }

  .satisfaction-row {
    margin-bottom: 12px;
  }
  .satisfaction-row:last-child {
    margin-bottom: 0;
  }

  .satisfaction-label-row {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    margin-bottom: 6px;
  }
  .satisfaction-label {
    font-size: 13px;
    font-weight: 800;
    color: #374151;
  }

  .satisfaction-bar {
    width: 100%;
    height: 10px;
    background: #ededed;
    border-radius: 999px;
    overflow: hidden;
  }
  .satisfaction-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ffd000 0%, #ffa800 100%);
    border-radius: 999px;
    transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @media (max-width: 380px) {
    .card-wide {
      width: calc(100% + 16px);
      margin-left: -8px;
      margin-right: -8px;
      padding: 0 2px;
    }
    .card-wide > .card-inner {
      padding: 14px 14px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .limit-pill .spark {
      animation: none;
    }
  }
</style>

<div class="timer-wrap">
  <div class="timer-container">
    <div class="sale-badge">대한한우 전국 왕도매가 도전!</div>
    <div class="title">다음 출고 접수 마감까지 (서두르세요)</div>

    <div class="countdown">
      <div class="time-box">
        <div class="time-number" id="tw-hours">00</div>
      </div>
      <div class="colon">:</div>
      <div class="time-box">
        <div class="time-number" id="tw-minutes">00</div>
      </div>
      <div class="colon">:</div>
      <div class="time-box">
        <div class="time-number" id="tw-seconds">00</div>
      </div>
      <div class="colon">:</div>
      <div class="time-box tenth">
        <div class="time-number" id="tw-tenth">9</div>
      </div>
    </div>

    <div class="price-warning">
      단골장사를 위해 3중선별 최상의 품질유지를 위한 한정출고!
    </div>

    <div class="limit-pill">
      <span class="spark">✦</span>
      <span>하루 주문 가능수량: <span class="limit-num"><span id="tw-limit">100</span>박스!</span></span>
      <span class="spark">✦</span>
    </div>

    <div class="card-wide">
      <div class="card-inner card-soft">
        <div class="stock-warning-title">
          ⚠️ 마진은 내리고<span class="arrow">↓</span> 만족도는 올리고<span class="arrow">↑</span> 가격은 저렴하게!
        </div>
        <div class="stock-warning-sub">
          주문량이 많은 상품으로 조기마감 될 수 있습니다.
        </div>
      </div>
    </div>

    <div class="card-wide">
      <div class="card-inner card-soft">
        <div class="satisfaction-header">
          <div class="satisfaction-title">대한한우 평균만족도</div>
          <div class="satisfaction-badge">전 월 기준</div>
        </div>

        <div class="satisfaction-row">
          <div class="satisfaction-label-row">
            <div class="satisfaction-label">재구매율</div>
          </div>
          <div class="satisfaction-bar">
            <div class="satisfaction-fill" id="tw-repurchase-fill"></div>
          </div>
        </div>

        <div class="satisfaction-row">
          <div class="satisfaction-label-row">
            <div class="satisfaction-label">고객후기평점도</div>
          </div>
          <div class="satisfaction-bar">
            <div class="satisfaction-fill" id="tw-satisfaction-fill"></div>
          </div>
        </div>

        <div class="satisfaction-row">
          <div class="satisfaction-label-row">
            <div class="satisfaction-label">선물만족도</div>
          </div>
          <div class="satisfaction-bar">
            <div class="satisfaction-fill" id="tw-gift-fill"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    // =============================================
    // ★ 하루 주문 가능수량
    // =============================================
    var DAILY_LIMIT = 800;
    var limitEl = document.getElementById("tw-limit");
    if (limitEl) limitEl.textContent = DAILY_LIMIT;

    // =============================================
    // 타이머 (매일 오전 10시 기준 24시간 카운트다운)
    // =============================================
    function twUpdateTimer() {
      var now = new Date();
      var target = new Date(now);

      // 오늘 오전 10시
      target.setHours(10, 0, 0, 0);

      // 이미 지났다면 다음 날 오전 10시가 마감
      if (now >= target) {
        target.setDate(target.getDate() + 1);
      }

      var remainingMs = target - now;
      if (remainingMs < 0) remainingMs = 0;

      var ticks = Math.floor(remainingMs / 100);
      var tenth = ticks % 10;
      var totalSec = Math.floor(ticks / 10);
      var hours = Math.floor(totalSec / 3600);
      var minutes = Math.floor((totalSec % 3600) / 60);
      var secs = totalSec % 60;

      document.getElementById("tw-hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("tw-minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("tw-seconds").textContent = String(secs).padStart(2, "0");
      document.getElementById("tw-tenth").textContent = String(tenth);
    }

    // =============================================
    // 만족도 바 애니메이션
    // =============================================
    function twInitSatisfaction() {
      setTimeout(function () {
        var rf = document.getElementById("tw-repurchase-fill");
        var sf = document.getElementById("tw-satisfaction-fill");
        var gf = document.getElementById("tw-gift-fill");
        if (rf) rf.style.width = "92%";
        if (sf) sf.style.width = "97%";
        if (gf) gf.style.width = "86%";
      }, 300);
    }

    twUpdateTimer();
    twInitSatisfaction();
    setInterval(twUpdateTimer, 100);
  })();
</script>
